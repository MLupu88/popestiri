services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: popestiri
      POSTGRES_USER: popestiri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popestiri -d popestiri"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
